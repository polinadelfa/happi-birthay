<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>С Днем Рождения!</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Comic+Neue:wght@400;700&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Comic Neue', cursive;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #5a2a27;
            text-align: center;
            overflow-x: hidden;
        }
        
        .container {
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            max-width: 800px;
            margin: 20px;
            position: relative;
            overflow: hidden;
        }
        
        h1 {
            font-family: 'Pacifico', cursive;
            font-size: 3.5rem;
            margin: 0;
            color: #e74c3c;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }
        
        .age {
            font-size: 5rem;
            font-weight: bold;
            color: #e74c3c;
            margin: 10px 0;
            text-shadow: 3px 3px 0px rgba(0, 0, 0, 0.1);
        }
        
        .message {
            font-size: 1.5rem;
            line-height: 1.6;
            margin: 20px 0;
        }
        
        .balloon {
            position: absolute;
            width: 50px;
            height: 70px;
            background-color: rgba(231, 76, 60, 0.7);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }
        
        .balloon:before {
            content: "";
            position: absolute;
            width: 2px;
            height: 50px;
            background-color: #95a5a6;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
        }
        
        .balloon:nth-child(2n) {
            background-color: rgba(155, 89, 182, 0.7);
            animation-delay: 1s;
        }
        
        .balloon:nth-child(3n) {
            background-color: rgba(52, 152, 219, 0.7);
            animation-delay: 2s;
        }
        
        .balloon:nth-child(4n) {
            background-color: rgba(46, 204, 113, 0.7);
            animation-delay: 3s;
        }
        
        .balloon:nth-child(5n) {
            background-color: rgba(241, 196, 15, 0.7);
            animation-delay: 4s;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(5deg); }
            50% { transform: translateY(-20px) rotate(-5deg); }
        }
        
        .cake {
            font-size: 4rem;
            margin: 20px 0;
            animation: bounce 1s infinite alternate;
        }
        
        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }
        
        .wish-btn {
            background: linear-gradient(45deg, #e74c3c, #f39c12);
            border: none;
            color: white;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }
        
        .wish-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background-color: #f00;
            border-radius: 50%;
            animation: confetti-fall 5s linear infinite;
            opacity: 0;
        }
        
        @keyframes confetti-fall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
        
        .photo-frame {
            width: 200px;
            height: 200px;
            border: 10px solid #f1c40f;
            border-radius: 10px;
            margin: 20px auto;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <!-- Воздушные шарики -->
    <div class="balloon" style="left: 10%; top: 10%;"></div>
    <div class="balloon" style="left: 20%; top: 30%;"></div>
    <div class="balloon" style="left: 80%; top: 20%;"></div>
    <div class="balloon" style="left: 70%; top: 40%;"></div>
    <div class="balloon" style="left: 40%; top: 15%;"></div>
    
    <div class="container">
        <h1>С Днем Рождения!</h1>
        <div class="age"></div>
        
        <div class="photo-frame">
            <!-- Замените src на путь к реальному фото -->
            <img src="" alt="">
        </div>
        
        <div class="message">
            <br>
            В этот чудесный день желаю тебе счастья, здоровья,<br>
            исполнения всех желаний и море улыбок!<br>
            Пусть каждый день будет наполнен радостью и теплом!
        </div>
        
        <div class="cake">🎂</div>
        
        <button class="wish-btn" id="wishBtn">Отправить пожелание</button>
    </div>
    
    <script>
        // Создаем конфетти
        function createConfetti() {
            const colors = ['#f44336', '#e91e63', '#9c27b0', '#673ab7', '#3f51b5', '#2196f3', '#03a9f4', '#00bcd4', '#009688', '#4CAF50', '#8BC34A', '#CDDC39', '#FFEB3B', '#FFC107', '#FF9800', '#FF5722'];
            
            for (let i = 0; i < 100; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.width = Math.random() * 10 + 5 + 'px';
                confetti.style.height = confetti.style.width;
                confetti.style.animationDuration = Math.random() * 3 + 2 + 's';
                confetti.style.animationDelay = Math.random() * 2 + 's';
                
                document.body.appendChild(confetti);
                
                // Удаляем конфетти после анимации
                setTimeout(() => {
                    confetti.remove();
                }, 5000);
            }
        }
        
        // Обработчик кнопки
        document.getElementById('wishBtn').addEventListener('click', function() {
            createConfetti();
            this.textContent = '🎉 Ура! 🎉';
            setTimeout(() => {
                this.textContent = 'Отправить пожелание';
            }, 2000);
        });
        
        // Добавляем несколько шариков при загрузке
        window.onload = function() {
            for (let i = 0; i < 10; i++) {
                const balloon = document.createElement('div');
                balloon.className = 'balloon';
                balloon.style.left = Math.random() * 100 + '%';
                balloon.style.top = Math.random() * 100 + '%';
                balloon.style.transform = 'scale(' + (Math.random() * 0.5 + 0.5) + ')';
                balloon.style.animationDelay = Math.random() * 5 + 's';
                
                document.body.appendChild(balloon);
            }
        };
    </script>
</body>
</html>
